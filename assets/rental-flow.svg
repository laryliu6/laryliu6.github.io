<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">租房需求 Agent 拟议工作流</title><desc id="desc">概念示意，需求澄清到信息整理再到辅助比较，并非已完成产品界面</desc><rect width="1000" height="340" fill="#e6ebe3"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#304c38"><text x="45" y="52" font-size="15">CONCEPT / NOT A PRODUCT SCREENSHOT</text><g fill="#f7f6f2" stroke="#91a28e"><rect x="45" y="110" width="260" height="150" rx="6"/><rect x="370" y="110" width="260" height="150" rx="6"/><rect x="695" y="110" width="260" height="150" rx="6"/></g><g font-size="25"><text x="75" y="158">01 需求澄清</text><text x="400" y="158">02 信息整理</text><text x="725" y="158">03 辅助比较</text></g><g font-size="17"><text x="75" y="200">预算 / 通勤 / 空间偏好</text><text x="400" y="200">用户提供的房源与缺失项</text><text x="725" y="200">选择依据与追问清单</text></g><g font-size="28"><text x="327" y="190">→</text><text x="652" y="190">→</text></g></g></svg>